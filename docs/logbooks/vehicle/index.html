<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ကား အဝင်အထွက် မှတ်တမ်း</title>
<meta name="theme-color" content="#166534">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#ddd5bd;color:#1d2a4a;-webkit-text-size-adjust:100%}
#app{display:flex;flex-direction:column;height:100dvh}
.strip{background:#f7f3e8;border-bottom:1px solid #c9bfa5;padding:4px 6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;z-index:5}
.strip button{background:#fffef9;border:1.5px solid #b9ac8c;border-radius:8px;padding:5px 8px;font-size:13.5px;line-height:1.3;white-space:nowrap;color:#1d2a4a;cursor:pointer}
.strip button:active{background:#efe8d2}
#dateBtn{font-weight:700;min-width:98px}
.zoomctl{margin-left:auto;display:flex;gap:5px;align-items:center;flex:1 1 auto;min-width:0}
#zoomSlider{flex:1 1 120px;min-width:100px;max-width:180px;height:28px;margin:0;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
#zoomSlider::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#b9ac8c}
#zoomSlider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:#166534;border:2px solid #fffef9;box-shadow:0 1px 4px rgba(0,0,0,.35);margin-top:-9px}
#zoomSlider::-moz-range-track{height:4px;border-radius:2px;background:#b9ac8c}
#zoomSlider::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#166534;border:2px solid #fffef9;box-shadow:0 1px 4px rgba(0,0,0,.35)}
#zoomPct{min-width:42px;text-align:center;font-weight:700;font-size:13.5px;padding:6px 2px;cursor:pointer;user-select:none;-webkit-user-select:none}
#chipsPanel{background:#f7f3e8;border-bottom:1px solid #c9bfa5;padding:8px;display:none}
#chipsPanel.open{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.chip{background:#fffef9;border:1.5px solid #166534;color:#14532d;border-radius:999px;padding:8px 14px;font-size:16px;cursor:pointer;overflow-wrap:anywhere;max-width:100%;text-align:left}
.chip .cx{color:#b91c1c;font-weight:800;margin-left:8px}
.chipAdd{display:flex;gap:8px;flex-wrap:wrap}
.chipAdd input{flex:1;min-width:140px;font-size:16px;padding:9px 10px;border:1.5px solid #b9ac8c;border-radius:10px;background:#fff}
.chipAdd button{background:#fffef9;border:1.5px solid #b9ac8c;border-radius:10px;padding:9px 12px;font-size:15px;cursor:pointer}
#sugStrip{display:none;background:#f7f3e8;border-top:1px solid #c9bfa5}
#sugStrip.open{display:flex}
#sugStrip.kb{position:fixed;left:0;right:0;z-index:65;box-shadow:0 -3px 14px rgba(0,0,0,.25)}
#sugScroll{flex:1 1 auto;min-width:0;overflow-x:auto;overflow-y:hidden;white-space:nowrap;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain;scrollbar-width:none;padding:6px 8px}
#sugScroll::-webkit-scrollbar{display:none}
#sugScroll.editing .sugChip{border-color:#b45309;color:#92400e;border-style:dashed}
#sugSide{flex:0 0 auto;display:none;align-items:center;padding:6px 8px 6px 0}
#sugSide.on{display:flex}
.sugModeBtn{background:#fffef9;border:1.5px solid #b9ac8c;border-radius:10px;padding:7px 12px;font-size:15px;cursor:pointer;color:#1d2a4a;white-space:nowrap;touch-action:manipulation}
.sugModeBtn.on{background:#b45309;border-color:#b45309;color:#fff;font-weight:700}
.sugChip{display:inline-block;vertical-align:middle;margin-right:8px;background:#fffef9;border:1.5px solid #166534;color:#14532d;border-radius:999px;padding:7px 13px;font-size:15px;cursor:pointer;white-space:nowrap;touch-action:pan-x}
.sugAct{display:inline-block;vertical-align:middle;white-space:nowrap}
.sugActName{font-weight:700;font-size:16px;color:#14532d;margin-right:8px}
.sugBtn{display:inline-block;vertical-align:middle;margin-right:8px;border-radius:999px;padding:7px 13px;font-size:15px;cursor:pointer;white-space:nowrap;border:1.5px solid #166534;background:#166534;color:#fff;font-weight:700;touch-action:manipulation}
.sugBtn.alt{background:#fffef9;color:#14532d}
.sugBtn.danger{background:#b91c1c;border-color:#b91c1c;color:#fff}
.sugBtn.ghost{background:#fffef9;border-color:#b9ac8c;color:#1d2a4a;font-weight:400}
.sugAsk{display:inline-block;vertical-align:middle;font-size:15px;font-weight:700;color:#7f1d1d;margin-right:8px;white-space:nowrap}
.sugEditIn{display:inline-block;vertical-align:middle;font-size:16px;padding:7px 10px;border:1.5px solid #166534;border-radius:10px;background:#fff;margin-right:8px;width:170px}
td textarea.cell{width:100%;border:none;background:transparent;font:inherit;color:inherit;outline:none;padding:5px 2px;resize:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;display:block;line-height:1.35}
td textarea.cell[data-f="detail"]{font-size:18px;font-weight:700;color:#1d4ed8}
#pageArea{flex:1;overflow:auto;touch-action:none;position:relative;background:#d8cfb4;-webkit-overflow-scrolling:touch}
#sizer{position:relative;margin:0 auto}
#scaler{position:absolute;top:0;left:0;transform-origin:0 0}
.paper{background:#fffef9;width:576px;min-height:780px;padding:14px 8px 20px;box-shadow:0 2px 12px rgba(0,0,0,.28);display:flex;flex-direction:column}
.paper.flip{animation:flip .26s ease}
@keyframes flip{from{transform:rotateY(-13deg);opacity:.35}to{transform:rotateY(0);opacity:1}}
.vhead{display:flex;justify-content:space-between;align-items:baseline;margin:0 4px 10px;font-size:15px}
.vhead .vt{font-size:23px;font-weight:800;letter-spacing:1px}
table{border-collapse:collapse;width:100%;table-layout:fixed;background:#fffef9}
th,td{border:1px solid #6e7a90;padding:4px 6px;font-size:16px;vertical-align:middle;height:46px}
thead th{background:#f3ecd9;text-align:center;font-weight:700}
thead tr:last-child th{border-bottom:3px double #1d2a4a}
td input.cell{width:100%;border:none;background:transparent;font:inherit;color:inherit;outline:none;padding:5px 2px}
td.ser{text-align:center;color:#43536e}
td.plate input.cell{font-weight:600;white-space:nowrap}
tr.inside td{background:rgba(230,176,66,.20)}
tr.inside td.ser{border-left:4px solid #d9a441}
td.tcell{text-align:center;cursor:pointer}
td.tcell .tl{font-weight:400;white-space:nowrap;color:#1d2a4a}
td.tcell .tl.empty{color:#9aa7bd;font-weight:400}
td.dc{position:relative;padding-right:26px}
td.dc .del{position:absolute;right:3px;top:50%;transform:translateY(-50%);background:none;border:none;color:#c0392b;font-size:17px;cursor:pointer;padding:4px;line-height:1}
.ruled{flex:1;min-height:120px;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 43px,#c3cede 43px,#c3cede 44px)}
.addrow{margin-top:12px;align-self:flex-start;background:none;border:1.5px dashed #166534;color:#166534;border-radius:10px;padding:10px 16px;font-size:16px;cursor:pointer}
#bottomBar{background:#f7f3e8;border-top:1px solid #c9bfa5;padding:8px 10px calc(48px + env(safe-area-inset-bottom))}
#photoBtn{width:100%;background:#166534;color:#fff;border:none;border-radius:12px;padding:16px;font-size:20px;font-weight:700;cursor:pointer}
#photoBtn.done{background:#14532d}
#undoBar{position:fixed;left:12px;right:12px;bottom:calc(118px + env(safe-area-inset-bottom));background:#1d2a4a;color:#fff;border-radius:12px;padding:12px 16px;display:none;align-items:center;justify-content:space-between;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#undoBar.show{display:flex}
#undoBar button{background:#fff;color:#1d2a4a;border:none;border-radius:8px;padding:8px 16px;font-weight:700;font-size:15px;cursor:pointer}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:80;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
.sheetBox{background:#fffef9;width:100%;max-height:94dvh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(48px + env(safe-area-inset-bottom))}
.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheetHead b{font-size:16px}
#sheetClose{background:#eee7d2;border:none;border-radius:8px;width:38px;height:38px;font-size:17px;cursor:pointer}
#sheetImg{width:100%;height:auto;display:block;border:1px solid #d8d2bd;background:#fff}
.hint{text-align:center;color:#5a6a8a;margin:10px 0;font-size:14px}
#shareBtn{width:100%;background:#166534;color:#fff;border:none;border-radius:12px;padding:17px;font-size:19px;font-weight:700;cursor:pointer}
#dlBtn{width:100%;margin-top:10px;background:#fffef9;border:2px solid #166534;color:#166534;border-radius:12px;padding:13px;font-size:16px;font-weight:700;cursor:pointer}
#sigSheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:85;align-items:flex-end;justify-content:center}
#sigSheet.open{display:flex}
#sigClose{background:#eee7d2;border:none;border-radius:8px;width:38px;height:38px;font-size:17px;cursor:pointer}
.sigLabel{font-size:13px;color:#5a6a8a;margin:8px 0 6px}
#sigPrevWrap{display:none;margin-bottom:6px}
#sigPrev{display:block;max-width:100%;max-height:120px;border:1px solid #d8d2bd;border-radius:8px;background-color:#fffef9;background-image:repeating-conic-gradient(#e9e3cf 0% 25%,#fffef9 0% 50%);background-size:16px 16px}
#sigPad{display:block;width:100%;height:220px;border:1.5px solid #b9ac8c;border-radius:10px;background-color:#fffef9;background-image:linear-gradient(to bottom,rgba(0,0,0,0) 168px,#ddd5ba 168px,#ddd5ba 169px,rgba(0,0,0,0) 169px);touch-action:none}
.sigBtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sigBtns button{flex:1;min-width:70px;border-radius:10px;padding:13px 6px;font-size:16px;cursor:pointer;background:#fffef9;border:1.5px solid #b9ac8c;color:#1d2a4a}
#sigSave{background:#166534;border-color:#166534;color:#fff;font-weight:700}
#sigDelete{color:#b91c1c;border-color:#d8a7a7}
#datePick,#timePick{position:fixed;left:8px;bottom:8px;width:28px;height:28px;opacity:.01;border:none;z-index:70;pointer-events:none;padding:0}
#bootFail{position:fixed;inset:0;background:#fffef9;display:none;z-index:99;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:18px}
#bootFail button{background:#166534;color:#fff;border:none;border-radius:12px;padding:14px 22px;font-size:17px;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div class="strip">
    <button id="prevDay">‹ ရှေ့</button>
    <button id="dateBtn">–</button>
    <button id="todayBtn">ဒီနေ့</button>
    <button id="nextDay">နောက် ›</button>
    <div class="zoomctl">
      <input type="range" id="zoomSlider" min="10" max="200" step="1" value="100" aria-label="Zoom">
      <span id="zoomPct" title="အပြည့်">100%</span>
      <button id="chipsToggle">🚗 ယာဉ်များ</button>
      <button id="sigBtn" title="လက်မှတ်">✍️ လက်မှတ်</button>
    </div>
  </div>
  <div id="chipsPanel">
    <div class="chips" id="chips"></div>
    <div class="chipAdd">
      <input id="newPlate" placeholder="ယာဉ်အမှတ်အသစ်">
      <button id="addPlate">+ ထည့်မယ်</button>
      <button id="editPlates">ပြင်</button>
    </div>
  </div>
  <div id="pageArea">
    <div id="sizer">
      <div id="scaler">
        <div class="paper" id="paper">
          <div class="vhead"><span id="vDateL"></span><span class="vt">‹ DAY ›</span><span id="vPageR"></span></div>
          <table id="tbl">
            <colgroup><col style="width:38px"><col style="width:106px"><col style="width:142px"><col style="width:86px"><col style="width:86px"><col></colgroup>
            <thead>
              <tr><th rowspan="2">စဉ်</th><th rowspan="2">ယာဉ်အမှတ်</th><th rowspan="2">ယာဉ်မောင်း</th><th colspan="2">အချိန်</th><th rowspan="2">အကြောင်းအရာ</th></tr>
              <tr><th>ဝင်</th><th>ထွက်</th></tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div class="ruled"></div>
          <button class="addrow" id="addRow">+ အတန်းသစ် ထည့်မယ်</button>
        </div>
      </div>
    </div>
  </div>
  <div id="sugStrip"><div id="sugScroll"></div><div id="sugSide"></div></div>
  <div id="bottomBar"><button id="photoBtn">📷 Photo ထုတ်မယ်</button></div>
</div>
<div id="undoBar"><span>ဖျက်လိုက်ပါပြီ</span><button id="undoBtn">ပြန်ယူမယ်</button></div>
<div id="sheet">
  <div class="sheetBox">
    <div class="sheetHead"><b id="sheetName">photo.png</b><button id="sheetClose">✕</button></div>
    <img id="sheetImg" alt="logbook photo">
    <div class="hint">ပုံကို ဖိထားပြီး Save လုပ်လို့လည်း ရတယ်</div>
    <button id="shareBtn">📤 Share — Viber နဲ့ ပို့မယ်</button>
    <button id="dlBtn">⬇ Download — သိမ်းမယ်</button>
  </div>
</div>
<div id="sigSheet">
  <div class="sheetBox">
    <div class="sheetHead"><b>လက်မှတ်</b><button id="sigClose">✕</button></div>
    <div id="sigPrevWrap"><div class="sigLabel">သိမ်းထားတဲ့ လက်မှတ်</div><img id="sigPrev" alt="signature"></div>
    <div class="sigLabel">လက်မှတ် ရေးဆွဲရန်</div>
    <canvas id="sigPad"></canvas>
    <div class="sigBtns">
      <button id="sigClear">ရှင်းမယ်</button>
      <button id="sigDelete">🗑 ဖျက်မယ်</button>
      <button id="sigSave">သိမ်းမယ်</button>
      <button id="sigCloseBtn">ပိတ်မယ်</button>
    </div>
  </div>
</div>
<input type="date" id="datePick">
<input type="time" id="timePick">
<div id="bootFail"><div>စာအုပ် ဖွင့်မရပါ</div><button onclick="location.reload()">🔄 ပြန်ဖွင့်မယ်</button></div>
<script>
(function(){
'use strict';
var LOGK='lunkhrunre_vehicle_log_v1', PLATEK='lunkhrunre_vehicle_plates_v1', ZOOMK='lunkhrunre_vehicle_zoom_v1';
var WD=['တနင်္ဂနွေ','တနင်္လာ','အင်္ဂါ','ဗုဒ္ဓဟူး','ကြာသပတေး','သောကြာ','စနေ'];
var MYD='၀၁၂၃၄၅၆၇၈၉';
var LW=576;
function $(id){ return document.getElementById(id); }
function toMy(s){ return String(s).replace(/[0-9]/g,function(d){ return MYD[+d]; }); }
function pad(n){ return (n<10?'0':'')+n; }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseD(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function toStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDays(s,n){ var d=parseD(s); d.setDate(d.getDate()+n); return toStr(d); }
function fmtDMY(s){ var p=s.split('-'); return toMy(p[2]+'/'+p[1]+'/'+p[0]); }
function fmtDMYdots(s){ var p=s.split('-'); return toMy(p[2]+'.'+p[1]+'.'+p[0]); }
function fmtDMYsp(s){ var p=s.split('-'); return toMy(p[2]+' / '+p[1]+' / '+p[0]); }
function wdName(s){ return WD[parseD(s).getDay()]; }
function fmtTime(t){ if(!t) return ''; var p=t.split(':'); var h=+p[0]; var ap=h>=12?'PM':'AM'; var h12=h%12; if(h12===0)h12=12; return h12+':'+p[1]+' '+ap; }
function nowT(){ var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

var memStore={};
var storageOK=true;
try{ localStorage.setItem('__probe__','1'); localStorage.removeItem('__probe__'); }catch(e){ storageOK=false; }
var store={
  get:function(k){ try{ return storageOK? localStorage.getItem(k) : (k in memStore? memStore[k]:null); }catch(e){ return (k in memStore)? memStore[k]:null; } },
  set:function(k,v){ try{ if(storageOK){ localStorage.setItem(k,v); } else { memStore[k]=v; } }catch(e){ memStore[k]=v; } }
};
function loadJSON(k,def){ try{ var v=store.get(k); return v? JSON.parse(v): def; }catch(e){ return def; } }

var log=loadJSON(LOGK,{});
var plates=loadJSON(PLATEK,[]);
var zoom=parseFloat(store.get(ZOOMK))||1;
if(!(zoom>=0.1&&zoom<=2)) zoom=1;
var cur=todayStr();
var editPlates=false;
var pendingTime=null;
var undoInfo=null, undoTimer=null;

var area=$('pageArea'), sizer=$('sizer'), scaler=$('scaler'), paper=$('paper'), tbody=$('tbody');

function save(){ store.set(LOGK, JSON.stringify(log)); }
function savePlates(){ store.set(PLATEK, JSON.stringify(plates)); }
function rows(){ return log[cur]||[]; }
function blankRow(){ return {id:uid(),plate:'',driver:'',timeIn:'',timeOut:'',detail:''}; }

function rowHtml(r,i,scratch){
  var inside=(!scratch && cur===todayStr() && r.timeIn && !r.timeOut)?' class="inside"':'';
  var h='<tr data-id="'+(scratch?'':r.id)+'"'+(scratch?' data-scratch="1"':'')+inside+'>';
  h+='<td class="ser">'+(scratch?'':toMy(i+1))+'</td>';
  h+='<td class="plate"><input class="cell" data-f="plate" value="'+esc(scratch?'':r.plate)+'" autocomplete="off"></td>';
  h+='<td><input class="cell" data-f="driver" value="'+esc(scratch?'':r.driver)+'" autocomplete="off"></td>';
  h+='<td class="tcell" data-t="in"><span class="tl'+((scratch||!r.timeIn)?' empty':'')+'">'+((!scratch&&r.timeIn)?fmtTime(r.timeIn):'—')+'</span></td>';
  h+='<td class="tcell" data-t="out"><span class="tl'+((scratch||!r.timeOut)?' empty':'')+'">'+((!scratch&&r.timeOut)?fmtTime(r.timeOut):'—')+'</span></td>';
  h+='<td class="dc"><textarea class="cell" data-f="detail" rows="1">'+esc(scratch?'':r.detail)+'</textarea>';
  if(!scratch) h+='<button class="del" title="ဖျက်">✕</button>';
  h+='</td></tr>';
  return h;
}
function render(){
  $('dateBtn').textContent=fmtDMY(cur);
  $('vDateL').textContent='Date: '+fmtDMYdots(cur);
  $('vPageR').textContent='Page: '+wdName(cur);
  var list=rows(), html='';
  for(var i=0;i<list.length;i++) html+=rowHtml(list[i],i,false);
  html+=rowHtml(null,list.length,true);
  tbody.innerHTML=html;
  growDetails();
  hideSug();
  requestAnimationFrame(applyZoom);
}
function rowOfTr(tr){ var id=tr.getAttribute('data-id'); if(!id) return null; var list=rows(); for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i]; return null; }
function adopt(tr){
  var r=blankRow(); if(!log[cur]) log[cur]=[]; log[cur].push(r);
  tr.setAttribute('data-id',r.id); tr.removeAttribute('data-scratch');
  tr.querySelector('.ser').textContent=toMy(log[cur].length);
  var dc=tr.querySelector('.dc');
  if(dc && !dc.querySelector('.del')){ var b=document.createElement('button'); b.className='del'; b.title='ဖျက်'; b.textContent='✕'; dc.appendChild(b); }
  tbody.insertAdjacentHTML('beforeend', rowHtml(null,log[cur].length,true));
  return r;
}
tbody.addEventListener('input',function(e){
  var inp=e.target; if(!inp.classList||!inp.classList.contains('cell')) return;
  var tr=inp.closest('tr'); if(!tr) return;
  var r=rowOfTr(tr); if(!r) r=adopt(tr);
  r[inp.getAttribute('data-f')]=inp.value; save();
  if(inp.tagName==='TEXTAREA'){ growTa(inp); applyZoom(); }
  if(sugTarget&&inp===sugTarget.inp){ sugFresh=false; if(sugManageRow||sugEdit||sugConfirm){ sugManageRow=null; sugEdit=null; sugConfirm=null; sugSig=''; } renderSug(); }
});
tbody.addEventListener('change',function(e){
  var inp=e.target; if(inp.classList&&inp.classList.contains('cell')&&inp.getAttribute('data-f')==='plate') learnPlate(inp.value.trim());
});
tbody.addEventListener('click',function(e){

function histValues(field){
  var seen={}, out=[];

    var list=log[d]||[];
    for(var i=list.length-1;i>=0;i--){

  return out.filter(function(v){ return hiddenPlates.indexOf(v)<0; });

function displayDrivers(){
  var seen={}, out=[];
  histValues('driver').forEach(function(v){ v=applyDriverAlias(v); if(!seen[v]){ seen[v]=1; out.push(v); } });
  return out.filter(function(v){ return blockedDrivers.indexOf(v)<0; });

/* ---------- typing suggestions ---------- */
var SUGF={'plate':1,'driver':1};
var sugTarget=null;
var sugFresh=false; /* driver cell just focused: show full list until he types */
function sugSource(field){ return field==='plate'? displayPlates() : displayDrivers(); }
var sugSig='';
var sugConfirm=null;   /* {v, field} delete-confirm pending in the strip */
var sugManage=false;   /* driver strip EDIT mode: chip taps manage a name, never insert */
var sugManageRow=null; /* {v} management row open for a driver (edit mode only) */
var sugEdit=null;      /* {v} inline rename editor open */
var sugModeRendered=''; /* mode key currently rendered in the strip */
function renderSug(){
  var strip=$('sugStrip'), sc=$('sugScroll');
  if(!sugTarget){ strip.classList.remove('open'); sc.innerHTML=''; sugSig=''; sugModeRendered=''; renderSugSide(); sugKbUpdate(); return; }
  if(sugConfirm){ renderSugConfirm(sc); renderSugSide(); sugKbUpdate(); return; }

  var all=sugSource(sugTarget.field);
  var vals=q? all.filter(function(v){ return v.toLowerCase().indexOf(q)>=0; }).slice(0,12) : all.slice(0,8);
  if(!vals.length){ strip.classList.remove('open'); sc.innerHTML=''; sugSig=''; sugModeRendered=''; renderSugSide(); sugKbUpdate(); return; }
  var sig=(sugManage?'M':'N')+vals.join('\u0001');
  if(sig===sugSig&&strip.classList.contains('open')){ renderSugSide(); sugKbUpdate(); return; }
  var keepSL=sc.scrollLeft||0;
  sc.innerHTML='';
  sugModeRendered='chips';
  sc.classList.toggle('editing', !!sugManage);
  vals.forEach(function(v){
    var b=document.createElement('button'); b.type='button'; b.className='sugChip'; b.textContent=v;
    addChipPress(b,v);

/* the strip's fixed last box: [ပြင်] toggles driver EDIT mode ([ပြီးပြီ] exits).
   It lives in #sugSide, OUTSIDE the scrolling chip row, so it is always
   visible while driver suggestions show. Plates never get it. Styled like
   the panel's ပြင် button (same outlined look). */
var sugModeBtn=null;
function renderSugSide(){
  var side=$('sugSide'), strip=$('sugStrip'); if(!side) return;
  var show=!!(sugTarget&&sugTarget.field==='driver'&&strip.classList.contains('open'));
  side.classList.toggle('on',show);
  if(!show) return;
  if(!sugModeBtn){
    sugModeBtn=document.createElement('button'); sugModeBtn.type='button'; sugModeBtn.className='sugModeBtn';
    addBtnTap(sugModeBtn,function(){

      else sugManage=true;

  sugModeBtn.classList.toggle('on',!!sugManage);

/* ---------- strip chip press: ONE canonical tap / swipe / long-press path ----------
   pointerdown records (x, y, strip.scrollLeft, target cell). pointerup acts ONLY
   on a genuine tap: |dx|<=10 AND |dy|<=10 AND the strip scrolled <=2px during the
   press. A sideways swipe either browser-scrolls the strip (pointercancel then
   discards the press) or fails the movement/scroll checks — it can never pick.
   A press held >=550ms with no movement and no strip scroll opens the
   delete-confirm for that chip instead, and its pointerup is swallowed. */
var chipPress=null, chipLpTimer=null;
function chipPressClear(){ if(chipLpTimer){ clearTimeout(chipLpTimer); chipLpTimer=null; } chipPress=null; }
function addChipPress(b,v){
  b.addEventListener('pointerdown',function(e){
    e.preventDefault();
    var sc=$('sugScroll');
    chipPress={v:v, x:e.clientX, y:e.clientY, sl:sc?sc.scrollLeft:0,
      inp:sugTarget?sugTarget.inp:null, field:sugTarget?sugTarget.field:null, lp:false};
    if(chipLpTimer) clearTimeout(chipLpTimer);
    chipLpTimer=setTimeout(function(){
      chipLpTimer=null;
      if(!chipPress||chipPress.v!==v||chipPress.lp) return;
      var s=$('sugScroll'); if(!s) return;
      if(Math.abs(s.scrollLeft-chipPress.sl)>2) return;
      chipPress.lp=true;
      sugManageRow=null; sugEdit=null;
      sugConfirm={v:v, field:chipPress.field||(sugTarget?sugTarget.field:null)};
      sugSig=''; sugModeRendered=''; renderSug();
    },550);
  });
  b.addEventListener('pointermove',function(e){
    if(!chipPress||chipPress.v!==v) return;
    if(Math.abs(e.clientX-chipPress.x)>10||Math.abs(e.clientY-chipPress.y)>10){
      if(chipLpTimer){ clearTimeout(chipLpTimer); chipLpTimer=null; }
    }
  });
  b.addEventListener('pointerup',function(e){
    if(!chipPress||chipPress.v!==v){ chipPressClear(); return; }
    var p=chipPress; chipPressClear();
    if(p.lp) return; /* long-press already opened the confirm */
    var s=$('sugScroll');
    var dsl=s?Math.abs(s.scrollLeft-p.sl):0;
    if(Math.abs(e.clientX-p.x)<=10&&Math.abs(e.clientY-p.y)<=10&&dsl<=2) onChipTap(v,p);
  });
  b.addEventListener('pointercancel',function(){ chipPressClear(); });
}
/* VEHICLE strip: in NORMAL mode a chip tap picks directly into the cell
   captured at pointerdown (drivers and plates alike). In EDIT mode —
   driver strip only, toggled by the strip's end [ပြင်] button — a driver
   chip tap opens that name's management row instead; it NEVER inserts. */
function onChipTap(v,p){
  var field=p.field||(sugTarget?sugTarget.field:null);
  if(field==='driver'&&sugManage){
    sugConfirm=null; sugEdit=null;
    sugManageRow={v:v};
    sugSig=''; sugModeRendered=''; renderSug();
  } else {
    pickSug(v, {inp:p.inp, field:p.field});
  }
}
/* labelled strip buttons share the chips' deferred pointerup tap rule */
function addBtnTap(b,fn){
  var bp=null;
  b.addEventListener('pointerdown',function(e){ e.preventDefault(); bp={x:e.clientX,y:e.clientY}; });
  b.addEventListener('pointerup',function(e){
    if(!bp) return;
    var dx=e.clientX-bp.x, dy=e.clientY-bp.y; bp=null;
    if(Math.abs(dx)<=10&&Math.abs(dy)<=10) fn();
  });
  b.addEventListener('pointercancel',function(){ bp=null; });
}
function sugBtn(txt,cls,fn){
  var b=document.createElement('button'); b.type='button'; b.className='sugBtn '+cls; b.textContent=txt;
  addBtnTap(b,fn);
  return b;
}

function renderSugEdit(sc){

/* rename a driver suggestion: record an alias so history-derived
   suggestions use the new spelling. Saved day rows never change. */
function renameDriver(oldV,newV){
  newV=(newV==null?'':String(newV)).trim();
  if(!newV||newV===oldV) return false;
  if(displayDrivers().indexOf(newV)>=0) return false;
  var hi=blockedDrivers.indexOf(newV); if(hi>=0){ blockedDrivers.splice(hi,1); saveBlockedDrivers(); }
  Object.keys(driverAlias).forEach(function(k){ if(driverAlias[k]===oldV) driverAlias[k]=newV; });
  driverAlias[oldV]=newV;
  saveDriverAlias();
  return true;
}
/* block a value from every suggestion source. Saved day rows are never
   touched — only suggestions are filtered. Drivers use the blocked list;
   plates reuse the existing hiddenPlates mechanism (as the panel does). */
function blockSuggestion(field,v){
  if(field==='driver'){
    if(blockedDrivers.indexOf(v)<0){ blockedDrivers.push(v); saveBlockedDrivers(); }
  } else {
    plates=plates.filter(function(x){ return x!==v; }); savePlates();
    if(hiddenPlates.indexOf(v)<0){ hiddenPlates.push(v); saveHiddenPlates(); }
    renderChips();
  }
}
function hideSug(){ sugTarget=null; sugFresh=false; sugSig=''; sugConfirm=null; sugManage=false; sugManageRow=null; sugEdit=null; sugModeRendered=''; chipPressClear(); var s=$('sugStrip'); if(s){ s.classList.remove('open'); var sc=$('sugScroll'); if(sc){ sc.innerHTML=''; sc.classList.remove('editing'); } } renderSugSide(); sugKbReset(); }
function pickSug(v,tgt){
  var t=(tgt&&tgt.inp)?tgt:sugTarget; if(!t||!t.inp||!document.contains(t.inp)) return;
  var inp=t.inp, field=t.field;
  inp.value=v;
  var tr=inp.closest('tr');
  if(tr){ var r=rowOfTr(tr); if(!r) r=adopt(tr); if(r){ r[field]=v; save(); } }

/* ---------- zoom / pan / pinch ---------- */
function applyZoom(){
  zoom=Math.min(2,Math.max(0.1,zoom));
  scaler.style.transform='scale('+zoom+')';
  sizer.style.width=(LW*zoom)+'px';
  sizer.style.height=(paper.offsetHeight*zoom)+'px';
  $('zoomPct').textContent=Math.round(zoom*100)+'%';
  var zs=$('zoomSlider'); if(zs) zs.value=Math.round(zoom*100);
  store.set(ZOOMK,String(zoom));
}
function zoomAt(f,mx,my){
  var z0=zoom; zoom=Math.min(2,Math.max(0.1,zoom*f));
  var cx=(area.scrollLeft+mx)/z0, cy=(area.scrollTop+my)/z0;
  applyZoom(); area.scrollLeft=cx*zoom-mx; area.scrollTop=cy*zoom-my;
}
var zoomSlider=$('zoomSlider');
zoomSlider.addEventListener('input',function(){
  var target=(parseFloat(zoomSlider.value)||100)/100;
  if(target!==zoom) zoomAt(target/zoom, area.clientWidth/2, area.clientHeight/2);
});
$('zoomPct').addEventListener('click',function(){
  zoom=area.clientWidth/LW; applyZoom(); area.scrollLeft=0; area.scrollTop=0;
});

var ptrs=new Map(), ges=null, suppressClickUntil=0;
function pdist(a,b){ var dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }
area.addEventListener('pointerdown',function(e){
  if(e.target&&e.target.closest&&e.target.closest('#sugStrip')) return; /* strip gestures are never page gestures */
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){
    var onInput=e.target.closest&&e.target.closest('input,textarea');
    ges={mode:onInput?'maybe':'pan', fromInput:!!onInput, sx:e.clientX, sy:e.clientY, sl:area.scrollLeft, st:area.scrollTop, t:Date.now(), target:e.target};
  } else if(ptrs.size===2){
    var p=Array.from(ptrs.values()); var rc=area.getBoundingClientRect();
    var mx=(p[0].x+p[1].x)/2-rc.left, my=(p[0].y+p[1].y)/2-rc.top;
    ges={mode:'pinch', d0:pdist(p[0],p[1])||1, z0:zoom, cx:(area.scrollLeft+mx)/zoom, cy:(area.scrollTop+my)/zoom};
  }
});
area.addEventListener('pointermove',function(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!ges) return;
  if(ges.mode==='pinch'&&ptrs.size===2){
    var p=Array.from(ptrs.values()); var rc=area.getBoundingClientRect();
    var mx=(p[0].x+p[1].x)/2-rc.left, my=(p[0].y+p[1].y)/2-rc.top;
    zoom=Math.min(2,Math.max(0.1, ges.z0*pdist(p[0],p[1])/ges.d0));
    applyZoom(); area.scrollLeft=ges.cx*zoom-mx; area.scrollTop=ges.cy*zoom-my;
  } else if(ges.mode==='maybe'&&ptrs.size===1){
    /* drag that started on a cell being edited: past a small threshold it
       becomes a page pan, so the page scrolls even while the keyboard is up */
    var mdx=e.clientX-ges.sx, mdy=e.clientY-ges.sy;
    if(mdx*mdx+mdy*mdy>196){ ges.mode='pan'; area.scrollLeft=ges.sl-mdx; area.scrollTop=ges.st-mdy; }
  } else if(ges.mode==='pan'&&ptrs.size===1){
    area.scrollLeft=ges.sl-(e.clientX-ges.sx);
    area.scrollTop=ges.st-(e.clientY-ges.sy);
  }
});
function pend(e){
  var g=ges;
  ptrs.delete(e.pointerId);
  if(ptrs.size<2&&g&&g.mode==='pinch') ges=null;
  if(ptrs.size===0){
    if(g&&g.mode==='pan'&&g.fromInput) suppressClickUntil=Date.now()+400;
    if(g&&g.mode==='pan'){
      var dx=e.clientX-g.sx, dy=e.clientY-g.sy, dt=Date.now()-g.t;
      var ae=document.activeElement;
      var editing=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA');
      var onCtl=g.target.closest&&g.target.closest('input,textarea,button,.tcell,.chip');
      if(!editing&&!onCtl&&zoom<=1.01&&dt<600&&Math.abs(dx)>100&&Math.abs(dy)<60) turn(dx<0?1:-1);
    }
    ges=null;
  }
}
area.addEventListener('pointerup',pend);
area.addEventListener('pointercancel',pend);
area.addEventListener('touchmove',function(e){ if(e.touches.length===2) e.preventDefault(); },{passive:false});
area.addEventListener('gesturestart',function(e){ e.preventDefault(); });
area.addEventListener('wheel',function(e){
  if(!e.ctrlKey) return; e.preventDefault();
  var rc=area.getBoundingClientRect();
  zoomAt(e.deltaY<0?1.1:0.9, e.clientX-rc.left, e.clientY-rc.top);
},{passive:false});

/* touch pinch fallback (no PointerEvent) */
if(!window.PointerEvent){
  var tGes=null;
  area.addEventListener('touchstart',function(e){
    if(e.touches.length===2){
      var rc=area.getBoundingClientRect();
      var mx=(e.touches[0].clientX+e.touches[1].clientX)/2-rc.left, my=(e.touches[0].clientY+e.touches[1].clientY)/2-rc.top;
      tGes={d0:pdist({x:e.touches[0].clientX,y:e.touches[0].clientY},{x:e.touches[1].clientX,y:e.touches[1].clientY})||1, z0:zoom, cx:(area.scrollLeft+mx)/zoom, cy:(area.scrollTop+my)/zoom};
    }
  },{passive:true});
  area.addEventListener('touchmove',function(e){
    if(tGes&&e.touches.length===2){
      var rc=area.getBoundingClientRect();
      var mx=(e.touches[0].clientX+e.touches[1].clientX)/2-rc.left, my=(e.touches[0].clientY+e.touches[1].clientY)/2-rc.top;
      zoom=Math.min(2,Math.max(0.1, tGes.z0*pdist({x:e.touches[0].clientX,y:e.touches[0].clientY},{x:e.touches[1].clientX,y:e.touches[1].clientY})/tGes.d0));
      applyZoom(); area.scrollLeft=tGes.cx*zoom-mx; area.scrollTop=tGes.cy*zoom-my;
    }
  },{passive:false});
  area.addEventListener('touchend',function(e){ if(e.touches.length<2) tGes=null; });
}

/* ---------- signature ---------- */
var SIGK='lunkhrunre_signature_v1';
var sigImg=null;
function sigData(){ return store.get(SIGK); }
function fmtSigDate(s){ var p=s.split('-'); return p[2]+'.'+p[1]+'.'+p[0].slice(2); }
function loadSigImg(cb){
  var url=sigData();
  if(!url){ sigImg=null; if(cb) cb(); return; }
  var im=new Image();
  im.onload=function(){ sigImg=im; if(cb) cb(); };
  im.onerror=function(){ sigImg=null; if(cb) cb(); };
  im.src=url;
}
var sigPadEl=$('sigPad'), padCtx=sigPadEl.getContext('2d');
var padDraw=false, padPts=[], padMid=null, padBox=null, padDirty=false;
function sizePad(){
  var r=sigPadEl.getBoundingClientRect(); if(r.width<10) return;
  var dpr=window.devicePixelRatio||1;
  sigPadEl.width=Math.round(r.width*dpr); sigPadEl.height=Math.round(r.height*dpr);
  padCtx.setTransform(dpr,0,0,dpr,0,0);
  padCtx.lineWidth=3.5; padCtx.lineCap='round'; padCtx.lineJoin='round';
  padCtx.strokeStyle='#14213d'; padCtx.fillStyle='#14213d';
  padPts=[]; padMid=null; padBox=null; padDirty=false; padDraw=false;
}
function clearPad(){
  padCtx.save(); padCtx.setTransform(1,0,0,1,0,0);
  padCtx.clearRect(0,0,sigPadEl.width,sigPadEl.height); padCtx.restore();
  padPts=[]; padMid=null; padBox=null; padDirty=false; padDraw=false;
}
function padPos(e){ var r=sigPadEl.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
function padTrack(p){
  if(!padBox) padBox={x0:p.x,y0:p.y,x1:p.x,y1:p.y};
  else{ padBox.x0=Math.min(padBox.x0,p.x); padBox.y0=Math.min(padBox.y0,p.y); padBox.x1=Math.max(padBox.x1,p.x); padBox.y1=Math.max(padBox.y1,p.y); }
}
sigPadEl.addEventListener('pointerdown',function(e){
  e.preventDefault();
  try{ sigPadEl.setPointerCapture(e.pointerId); }catch(err){}
  padDraw=true; var p=padPos(e); padPts=[p]; padMid=p; padTrack(p);
  padCtx.beginPath(); padCtx.arc(p.x,p.y,1.75,0,7); padCtx.fill();
  padDirty=true;
});
sigPadEl.addEventListener('pointermove',function(e){
  if(!padDraw) return;
  e.preventDefault();
  var p=padPos(e); padTrack(p);
  var prev=padPts[padPts.length-1]; padPts.push(p);
  var mid={x:(prev.x+p.x)/2,y:(prev.y+p.y)/2};
  padCtx.beginPath(); padCtx.moveTo(padMid.x,padMid.y);
  padCtx.quadraticCurveTo(prev.x,prev.y,mid.x,mid.y); padCtx.stroke();
  padMid=mid;
});
function padEnd(){
  if(!padDraw) return;
  padDraw=false;
  var last=padPts[padPts.length-1];
  if(last&&padMid&&(last.x!==padMid.x||last.y!==padMid.y)){
    padCtx.beginPath(); padCtx.moveTo(padMid.x,padMid.y); padCtx.lineTo(last.x,last.y); padCtx.stroke();
  }
  padPts=[];
}
sigPadEl.addEventListener('pointerup',padEnd);
sigPadEl.addEventListener('pointercancel',padEnd);
function updateSigUI(){
  var url=sigData();
  if(url){ $('sigPrev').src=url; $('sigPrevWrap').style.display='block'; $('sigDelete').style.display='block'; }
  else{ $('sigPrevWrap').style.display='none'; $('sigDelete').style.display='none'; }
}
function openSigSheet(){ $('sigSheet').classList.add('open'); updateSigUI(); sizePad(); }
function closeSigSheet(){ $('sigSheet').classList.remove('open'); }
$('sigBtn').addEventListener('click',openSigSheet);
$('sigClose').addEventListener('click',closeSigSheet);
$('sigCloseBtn').addEventListener('click',closeSigSheet);
$('sigSheet').addEventListener('click',function(e){ if(e.target===this) closeSigSheet(); });
$('sigClear').addEventListener('click',clearPad);
$('sigDelete').addEventListener('click',function(){
  store.set(SIGK,'');
  try{ localStorage.removeItem(SIGK); }catch(e){}
  sigImg=null; updateSigUI(); clearPad();
});
$('sigSave').addEventListener('click',function(){
  if(padDirty&&padBox){
    var dpr=window.devicePixelRatio||1, pd=8;
    var x0=Math.max(0,Math.floor((padBox.x0-pd)*dpr)), y0=Math.max(0,Math.floor((padBox.y0-pd)*dpr));
    var x1=Math.min(sigPadEl.width,Math.ceil((padBox.x1+pd)*dpr)), y1=Math.min(sigPadEl.height,Math.ceil((padBox.y1+pd)*dpr));
    if(x1>x0&&y1>y0){
      var out=document.createElement('canvas'); out.width=x1-x0; out.height=y1-y0;
      out.getContext('2d').drawImage(sigPadEl,x0,y0,x1-x0,y1-y0,0,0,x1-x0,y1-y0);
      try{ store.set(SIGK,out.toDataURL('image/png')); }catch(e){}
    }
  }
  loadSigImg(); closeSigSheet();
});
loadSigImg();

/* ---------- photo export ---------- */
function graphemes(text){
  if(window.Intl&&Intl.Segmenter){ try{ return Array.from(new Intl.Segmenter('my',{granularity:'grapheme'}).segment(String(text)),function(s){ return s.segment; }); }catch(e){} }
  return Array.from(String(text));
}
function wrapLines(ctx,text,maxW){
  if(!text) return [''];
  var gs=graphemes(text), lines=[], line='';
  for(var i=0;i<gs.length;i++){
    var g=gs[i];
    if(g==='\n'){ lines.push(line); line=''; continue; }
    var t=line+g;
    if(line&&ctx.measureText(t).width>maxW){ lines.push(line); line=g; } else line=t;
  }
  lines.push(line);
  return lines.length?lines:[''];
}
function fitFont(ctx,text,maxW,start,weight,min){
  var s=start, floor=min||18;
  ctx.font=weight+' '+s+'px sans-serif';
  while(s>floor&&ctx.measureText(text).width>maxW){ s-=2; ctx.font=weight+' '+s+'px sans-serif'; }
  return s;
}
function buildPhoto(){
  var W=1240, PAD=36, CW=W-2*PAD, cols=[56,190,226,150,150,396];
  var colX=[PAD]; for(var i=0;i<cols.length;i++) colX.push(colX[i]+cols[i]);
  var list=rows();
  var meas=document.createElement('canvas').getContext('2d');
  var detF='700 28px sans-serif';
  var infos=list.map(function(r){
    /* driver — single line, shrink-to-fit, never wraps (min 20px) */
    var drvSize=fitFont(meas,r.driver||'',cols[2]-32,28,'400',20);
    meas.font=detF; var dtl=wrapLines(meas,r.detail,cols[5]-32);
    var lines=Math.max(1,dtl.length);
    return {r:r,drvSize:drvSize,dtl:dtl,h:Math.max(66,lines*40+26)};
  });
  var topH=104, theadH=92, blankH=46*6, footH=30;
  var sum=0; infos.forEach(function(x){ sum+=x.h; });
  var H=topH+theadH+sum+blankH+footH;
  var tTop=topH, tBot=H-footH;
  var cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  var ctx=cv.getContext('2d');
  ctx.fillStyle='#fffef9'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#c9cede'; ctx.lineWidth=2; ctx.strokeRect(4,4,W-8,H-8);
  /* date header — one big bold line, left aligned, rule under. No DAY title, no "Page :" */
  var dtext='Date : '+fmtDMYsp(cur)+' ('+wdName(cur)+'နေ့)';
  ctx.fillStyle='#1d2a4a'; ctx.textAlign='left';
  fitFont(ctx,dtext,CW,38,'800');
  ctx.fillText(dtext,PAD,58);
  ctx.strokeStyle='#1d2a4a'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(PAD,86); ctx.lineTo(W-PAD,86); ctx.stroke();
  /* header band */
  ctx.fillStyle='#f3ecd9'; ctx.fillRect(PAD,tTop,CW,theadH);
  ctx.fillStyle='#1d2a4a';
  var midA=tTop+theadH/2+10;
  ctx.font='700 26px sans-serif'; ctx.textAlign='center';
  ctx.fillText('စဉ်',colX[0]+cols[0]/2,midA);
  ctx.fillText('ယာဉ်အမှတ်',colX[1]+cols[1]/2,midA);
  ctx.fillText('ယာဉ်မောင်း',colX[2]+cols[2]/2,midA);
  ctx.fillText('အချိန်',colX[3]+(cols[3]+cols[4])/2,tTop+38);
  ctx.fillText('အကြောင်းအရာ',colX[5]+cols[5]/2,midA);
  ctx.font='700 24px sans-serif';
  ctx.fillText('ဝင်',colX[3]+cols[3]/2,tTop+theadH-15);
  ctx.fillText('ထွက်',colX[4]+cols[4]/2,tTop+theadH-15);
  function drawLines(lines,x,ry,h){
    var lh=40, yy=ry+(h-lines.length*lh)/2+26;
    for(var i=0;i<lines.length;i++){ ctx.fillText(lines[i],x,yy); yy+=lh; }
  }
  /* entry rows */
  var y=tTop+theadH, today=todayStr();
  infos.forEach(function(inf,idx){
    var r=inf.r, h=inf.h;
    if(cur===today&&r.timeIn&&!r.timeOut){
      ctx.fillStyle='rgba(230,176,66,.25)'; ctx.fillRect(PAD,y,CW,h);
      ctx.fillStyle='#d9a441'; ctx.fillRect(PAD,y,5,h);
    }
    ctx.fillStyle='#1d2a4a';
    ctx.font='28px sans-serif'; ctx.textAlign='center';
    ctx.fillText(toMy(idx+1),colX[0]+cols[0]/2,y+h/2+10);
    /* plate — single line, shrink to fit, never wraps */
    ctx.textAlign='left';
    fitFont(ctx,r.plate||'',cols[1]-32,28,'600');
    if(r.plate) ctx.fillText(r.plate,colX[1]+16,y+h/2+10);
    /* driver — single line at its fitted size, vertically centred */
    ctx.font='400 '+inf.drvSize+'px sans-serif'; ctx.textAlign='left';
    if(r.driver) ctx.fillText(r.driver,colX[2]+16,y+h/2+Math.round(inf.drvSize*0.36));
    /* times — always one line */
    ctx.font='29px sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#1d2a4a';
    if(r.timeIn) ctx.fillText(fmtTime(r.timeIn),colX[3]+cols[3]/2,y+h/2+10);
    if(r.timeOut) ctx.fillText(fmtTime(r.timeOut),colX[4]+cols[4]/2,y+h/2+10);
    ctx.fillStyle='#1d4ed8';
    ctx.textAlign='left'; ctx.font=detF;
    drawLines(inf.dtl,colX[5]+16,y,h);
    y+=h;
  });
  /* grid */
  ctx.strokeStyle='#3f4a63'; ctx.lineWidth=2;
  for(var vi=0;vi<colX.length;vi++){ ctx.beginPath(); ctx.moveTo(colX[vi],tTop); ctx.lineTo(colX[vi],tBot); ctx.stroke(); }
  function hline(yy,dark){ ctx.strokeStyle=dark?'#1d2a4a':'#3f4a63'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(PAD,yy); ctx.lineTo(W-PAD,yy); ctx.stroke(); }
  hline(tTop);
  ctx.beginPath(); ctx.moveTo(colX[3],tTop+50); ctx.lineTo(colX[5],tTop+50); ctx.stroke();
  hline(tTop+theadH,true); hline(tTop+theadH+3,true);
  var gy=tTop+theadH;
  infos.forEach(function(inf){ gy+=inf.h; hline(gy); });
  for(var b=0;b<6;b++){ gy+=46; hline(gy); }
  ctx.strokeStyle='#3f4a63'; ctx.strokeRect(PAD,tTop,CW,tBot-tTop);
  /* signature — bottom-right inside the table, name under it */
  if(sigImg&&sigImg.complete&&sigImg.naturalWidth){
    var sH=96, sW=sH*sigImg.naturalWidth/sigImg.naturalHeight;
    if(sW>340){ sW=340; sH=Math.round(sW*sigImg.naturalHeight/sigImg.naturalWidth); }
    var sX=(W-PAD)-28-sW, sY=tBot-12-(sH+8+34);
    ctx.drawImage(sigImg,sX,sY,sW,sH);
    ctx.fillStyle='#14213d'; ctx.font='27px sans-serif'; ctx.textAlign='center';
    ctx.fillText('U Soe Yar Zar',sX+sW/2,sY+sH+35);
  }
  return cv;
}
var pending=null;
$('photoBtn').addEventListener('click',function(){
  if(sigData()&&!sigImg){ loadSigImg(doPhoto); } else { doPhoto(); }
});
function doPhoto(){
  var cv=buildPhoto(); var fname='vehicle-log-'+cur+'.png';
  pending={canvas:cv,fname:fname,file:null};
  $('sheetImg').src=cv.toDataURL('image/png');
  $('sheetName').textContent=fname;
  $('shareBtn').style.display='none';
  if(cv.toBlob){
    cv.toBlob(function(b){
      if(!b) return;
      try{
        var f=new File([b],fname,{type:'image/png'});
        if(navigator.canShare&&navigator.canShare({files:[f]})){ pending.file=f; $('shareBtn').style.display='block'; }
      }catch(e){}
    },'image/png');
  }
  $('sheet').classList.add('open');
}
$('shareBtn').addEventListener('click',function(){
  if(pending&&pending.file&&navigator.share){ navigator.share({files:[pending.file]}).catch(function(){}); }
});
$('dlBtn').addEventListener('click',function(){
  if(!pending) return;
  var a=document.createElement('a');
  a.href=pending.canvas.toDataURL('image/png');
  a.download=pending.fname;
  document.body.appendChild(a); a.click(); a.remove();
  var b=$('photoBtn'); var old=b.textContent;
  b.classList.add('done'); b.textContent='✅ ထုတ်ပြီးပါပြီ';
  setTimeout(function(){ b.classList.remove('done'); b.textContent=old; },1800);
});
$('sheetClose').addEventListener('click',function(){ $('sheet').classList.remove('open'); });
$('sheet').addEventListener('click',function(e){ if(e.target===this) this.classList.remove('open'); });

try{ renderChips(); render(); applyZoom(); }
catch(err){ var bf=$('bootFail'); if(bf) bf.style.display='flex'; }
})();
