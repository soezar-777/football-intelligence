<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Intelligence AI - Multi-League Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#090d16">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <style>
        body { font-family: 'Padauk', sans-serif; background-color: #090d16; color: #e2e8f0; }
        .card-border { border: 1px solid #1e293b; background: linear-gradient(145deg, #111827, #0b1120); }
        select, input { background-color: #1e293b; color: #ffffff; }
    </style>
</head>
<body class="min-h-screen p-3 md:p-6">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-3">
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-amber-400">⚽ Football Intelligence AI Pro</h1>
                <p class="text-[11px] md:text-xs text-slate-400">Auto Anti-Bias Engine | Poisson + xG Model</p>
            </div>
            <div class="flex items-center space-x-2 bg-slate-900/90 px-3 py-1.5 rounded-full border border-slate-700">
                <span class="text-xs font-bold text-slate-300">EN</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="langToggle" onchange="toggleEnglishNames()" class="sr-only peer">
                    <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-amber-500"></div>
                </label>
            </div>
        </div>

        <div class="card-border rounded-xl p-4 md:p-6 mb-6 shadow-xl">
            <h2 class="text-base md:text-lg font-bold text-amber-400 mb-4 border-b border-slate-800 pb-2">📋 ၁။ ပွဲစဉ်ဇယား စာရွက်မှ အုပ်စုနှင့် ပွဲစဉ် ရွေးချယ်ရန်</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">လိဂ် / ပြိုင်ပွဲအုပ်စု ရွေးပါ</label>
                    <select id="leagueSelect" onchange="loadMatches()" class="w-full rounded-lg p-2.5 text-sm border border-slate-700 focus:outline-none focus:border-amber-400"></select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">ပွဲစဉ် ရွေးပါ</label>
                    <select id="matchSelect" onchange="fillMatchData()" class="w-full rounded-lg p-2.5 text-sm border border-slate-700 focus:outline-none focus:border-amber-400"></select>
                </div>
            </div>
            <div class="mb-4">
                <button onclick="predictEntireLeague()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 px-4 rounded-lg transition duration-200 text-sm shadow-md">
                    ⚡ ရွေးထားသော အုပ်စုတစ်ခုလုံး (ပွဲအားလုံး) တစ်ပြိုင်နက် တွက်မည်
                </button>
            </div>
            <div class="flex gap-3">
                <button onclick="calculateSingleMatch()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2 px-4 rounded-lg text-sm">🎯 ဤပွဲစဉ်ကို တွက်ချက်မည်</button>
                <button onclick="clearCards()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 px-4 rounded-lg text-sm">ရှင်းလင်းမည်</button>
            </div>
        </div>

        <div id="outputHeader" class="hidden text-center mb-4">
            <h2 id="currentLeagueTitle" class="text-xl md:text-2xl font-bold text-amber-400"></h2>
            <p class="text-xs text-slate-400">ကြေး + ဒေတာ သုံးသပ်ချက် | Poisson Mathematical Verdict</p>
        </div>
        <div id="predictionsContainer" class="space-y-3"></div>
    </div>

    <script>
        const fixtureDatabase = {
            "UEFA ယူရိုပါလိဂ်": [
                { home: "လိုက်ပ်ဇစ်", homeEn: "RB Leipzig", away: "ပဲလေ", awayEn: "PAOK", time: "11:15", upper: "home", body: "=-50", goal: "3=", hxg: 1.8, hxga: 1.2, axg: 1.3, axga: 1.5, turf: false, low: false },
                { home: "တွန်ရင့်ဆီ", homeEn: "Twente", away: "ဆန်းဒါးလင်း", awayEn: "Sunderland", time: "11:15", upper: "away", body: "1-", goal: "3-20", hxg: 1.1, hxga: 1.6, axg: 1.7, axga: 1.1, turf: false, low: false },
                { home: "ရက်ဘူးဆဲလ်ဘတ်", homeEn: "RB Salzburg", away: "AC", awayEn: "AC Milan", time: "11:15", upper: "away", body: "=-", goal: "3-20", hxg: 1.4, hxga: 1.4, axg: 1.5, axga: 1.3, turf: false, low: false },
                { home: "လက်ပေရဲန်", homeEn: "Lech Poznań", away: "လေဗာကူဆင်", awayEn: "Bayer Leverkusen", time: "11:15", upper: "away", body: "1-10", goal: "3+60", hxg: 1.0, hxga: 1.9, axg: 2.1, axga: 0.9, turf: false, low: false },
                { home: "ဆယ်ဗီခာ", homeEn: "Sevilla", away: "ဟာရူပီဆီဗာ", awayEn: "Hapoel Be'er Sheva", time: "11:15", upper: "home", body: "2+60", goal: "3-70", hxg: 2.2, hxga: 0.9, axg: 0.8, axga: 2.1, turf: false, low: true },
                { home: "ဘုန်းမောက်", homeEn: "Bournemouth", away: "စတမ်းဂရုစ်", awayEn: "Sturm Graz", time: "1:30", upper: "home", body: "2-30", goal: "3-", hxg: 2.2, hxga: 0.9, axg: 0.8, axga: 2.0, turf: false, low: true },
                { home: "ဆယ်တာဗီဂို", homeEn: "Celta Vigo", away: "ဂျူဗင်တပ်", awayEn: "Juventus", time: "1:30", upper: "away", body: "=-80", goal: "2+50", hxg: 1.2, hxga: 1.3, axg: 1.5, axga: 1.1, turf: false, low: true },
                { home: "ဘင်ဖီကာ", homeEn: "Benfica", away: "ဆဲလ်တစ်", awayEn: "Celtic", time: "1:30", upper: "home", body: "2+20", goal: "3-", hxg: 2.2, hxga: 1.1, axg: 1.1, axga: 2.1, turf: false, low: false }
            ],
            "UEFA ကွန်းဖရန့်လိဂ်": [
                { home: "CSKA ဆိုဖီယာ", homeEn: "CSKA Sofia", away: "မိုနာကို", awayEn: "Monaco", time: "11:15", upper: "away", body: "1-40", goal: "3-30", hxg: 1.0, hxga: 1.8, axg: 1.9, axga: 1.0, turf: false, low: false },
                { home: "KUPS", homeEn: "KuPS Kuopio", away: "ထရာဇွန်စပွန်း", awayEn: "Trabzonspor", time: "11:15", upper: "away", body: "1-40", goal: "3-40", hxg: 1.1, hxga: 1.7, axg: 1.8, axga: 1.1, turf: true, low: false },
                { home: "အတ္တလန်တာ", homeEn: "Atalanta", away: "ပါဒိုဗာ FC", awayEn: "Paphos FC", time: "1:30", upper: "home", body: "2+90", goal: "3-30", hxg: 2.3, hxga: 0.9, axg: 0.8, axga: 2.2, turf: false, low: true },
                { home: "ဖရိုင်းဘတ်", homeEn: "SC Freiburg", away: "ဂျာတလိုနိုရက်", awayEn: "Jagiellonia", time: "1:30", upper: "home", body: "2+20", goal: "3-", hxg: 2.1, hxga: 1.0, axg: 0.9, axga: 2.0, turf: false, low: true }
            ]
        };

        window.onload = function() {
            const leagueSelect = document.getElementById('leagueSelect');
            for (let league in fixtureDatabase) {
                let opt = document.createElement('option');
                opt.value = league;
                opt.innerHTML = `${league} (${fixtureDatabase[league].length} ပွဲ)`;
                leagueSelect.appendChild(opt);
            }
            loadMatches();
        };

        function loadMatches() {
            const league = document.getElementById('leagueSelect').value;
            const matchSelect = document.getElementById('matchSelect');
            matchSelect.innerHTML = '';
            fixtureDatabase[league].forEach((m, index) => {
                let opt = document.createElement('option');
                opt.value = index;
                opt.innerHTML = `${m.home} vs ${m.away} (${m.time})`;
                matchSelect.appendChild(opt);
            });
        }

        function toggleEnglishNames() {
            const isEnglish = document.getElementById('langToggle').checked;
            document.querySelectorAll('.en-team-sub').forEach(el => {
                if (isEnglish) el.classList.remove('hidden');
                else el.classList.add('hidden');
            });
        }

        function factorial(n) {
            if (n === 0 || n === 1) return 1;
            let r = 1; for (let i = 2; i <= n; i++) r *= i; return r;
        }

        function poisson(k, lambda) {
            return (Math.pow(lambda, k) * Math.exp(-lambda)) / factorial(k);
        }

        function runEngine(matchObj) {
            let expHome = ((matchObj.hxg + matchObj.axga) / 2) * 1.08;
            let expAway = ((matchObj.axg + matchObj.hxga) / 2) * 0.95;
            if (matchObj.turf) { expHome += 0.25; expAway -= 0.35; }
            if (matchObj.low) { expHome *= 0.83; expAway *= 0.83; }

            expHome = Math.max(0.25, expHome); expAway = Math.max(0.25, expAway);
            let hWin = 0, draw = 0, aWin = 0, over25 = 0, bestScore = "1 - 1", maxP = 0;

            for (let h = 0; h <= 6; h++) {
                for (let a = 0; a <= 6; a++) {
                    let p = poisson(h, expHome) * poisson(a, expAway);
                    if (h > a) hWin += p; else if (h === a) draw += p; else aWin += p;
                    if ((h + a) > 2.5) over25 += p;
                    if (p > maxP) { maxP = p; bestScore = `${h} - ${a}`; }
                }
            }

            hWin = (hWin * 100).toFixed(1); draw = (draw * 100).toFixed(1); aWin = (aWin * 100).toFixed(1); over25 = (over25 * 100).toFixed(1);
            let totalXG = expHome + expAway;
            let goalVerdict = (over25 >= 52 && totalXG >= 2.6) ? 'များမယ်' : 'နည်းမယ်';
            let goalColor = (goalVerdict === 'များမယ်') ? 'text-emerald-400' : 'text-sky-400';
            let winnerVerdict = 'သရေ';
            let maxOut = Math.max(hWin, draw, aWin);
            if (hWin == maxOut && (hWin - aWin) > 6) winnerVerdict = `${matchObj.home} နိုင်`;
            else if (aWin == maxOut && (aWin - hWin) > 6) winnerVerdict = `${matchObj.away} နိုင်`;

            let confidence = maxOut >= 56 ? 'လတ်-မြင့်' : (maxOut >= 44 ? 'လတ်' : 'နိမ့်');
            let confColor = maxOut >= 56 ? 'text-amber-400' : (maxOut >= 44 ? 'text-white' : 'text-slate-400');
            let isEnglish = document.getElementById('langToggle') ? document.getElementById('langToggle').checked : false;
            let hiddenClass = isEnglish ? '' : 'hidden';

            return `
                <div class="card-border rounded-xl p-4 md:p-5 shadow-lg">
                    <div class="text-center mb-2">
                        <h3 class="text-lg md:text-xl font-bold text-white">${matchObj.upper === 'home' ? '↑ ' : ''}${matchObj.home} - ${matchObj.upper === 'away' ? '↑ ' : ''}${matchObj.away}</h3>
                        <div class="en-team-sub ${hiddenClass} text-[11px] text-amber-300 font-sans mt-0.5">(${matchObj.homeEn || matchObj.home} vs ${matchObj.awayEn || matchObj.away})</div>
                        <p class="text-xs text-slate-400 mt-1">${matchObj.time} | ဘော်ဒီ: <span class="text-amber-300">${matchObj.body}</span> | ဂိုးပေါင်း: <span class="text-amber-300">${matchObj.goal}</span></p>
                    </div>
                    <div class="grid grid-cols-3 text-center items-center py-2 border-t border-slate-800/80 mt-2">
                        <div class="${goalColor} font-bold text-base md:text-lg">${goalVerdict}</div>
                        <div class="text-white font-bold text-base md:text-lg">${winnerVerdict}</div>
                        <div class="${confColor} font-bold text-base md:text-lg">${confidence}</div>
                    </div>
                    <div class="grid grid-cols-4 text-center text-[11px] text-slate-400 mt-2 bg-slate-900/90 py-1.5 rounded border border-slate-800/60">
                        <div>အိမ်ရှင်: ${hWin}%</div><div>သရေ: ${draw}%</div><div>ဧည့်သည်: ${aWin}%</div><div class="text-amber-400 font-bold">ရလဒ်: ${bestScore}</div>
                    </div>
                </div>
            `;
        }

        function calculateSingleMatch() {
            const league = document.getElementById('leagueSelect').value;
            const index = document.getElementById('matchSelect').value;
            const m = fixtureDatabase[league][index];
            document.getElementById('outputHeader').classList.remove('hidden');
            document.getElementById('currentLeagueTitle').innerText = league;
            document.getElementById('predictionsContainer').insertAdjacentHTML('afterbegin', runEngine(m));
        }

        function predictEntireLeague() {
            const league = document.getElementById('leagueSelect').value;
            const container = document.getElementById('predictionsContainer');
            container.innerHTML = '';
            document.getElementById('outputHeader').classList.remove('hidden');
            document.getElementById('currentLeagueTitle').innerText = league;
            fixtureDatabase[league].forEach(m => container.insertAdjacentHTML('beforeend', runEngine(m)));
        }

        function clearCards() {
            document.getElementById('predictionsContainer').innerHTML = '';
            document.getElementById('outputHeader').classList.add('hidden');
        }
    </script>
</body>
</html>
